name: Build nsc_plugin (C++ MO2 plugin)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 直接用 aqtinstall 装 Qt，避免 jurplel/install-qt-action@v3 捆绑的旧版 aqtinstall
# （旧版用 'qt_base' 旧命名，在 Qt 6.7.1 的包索引里查不到，会报
#  "The packages ['qt_base'] were not found"）。最新 aqtinstall 用 'qtbase' 命名。
# 注意：aqtinstall 3.x 的 arch 必须是完整形式 win64_msvc2019_64，不能简写成 win64。
env:
  QT_VERSION: "6.7.1"
  QT_ARCH: "win64_msvc2019_64"
  QT_ROOT: "C:\\Qt"
  # aqtinstall 把桌面版 Qt 装到 <root>/<ver>/<arch>/，Qt6Config.cmake 在 lib/cmake/Qt6
  QT6_DIR: "C:\\Qt\\6.7.1\\win64_msvc2019_64\\lib\\cmake\\Qt6"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout (uibase vendored under uibase/src, no submodule)
        uses: actions/checkout@v4

      - name: Install Qt ${{ env.QT_VERSION }} via aqtinstall
        shell: pwsh
        run: |
          python -m pip install --upgrade pip aqtinstall
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} ${{ env.QT_ARCH }} -O "$env:QT_ROOT"
          Write-Host "=== Qt cmake dir present? ==="
          Get-ChildItem "$env:QT_ROOT/${{ env.QT_VERSION }}/${{ env.QT_ARCH }}/lib/cmake" | Select-Object Name

      - name: Configure
        run: cmake --preset ci
        env:
          QT6_DIR: ${{ env.QT6_DIR }}
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT }}\${{ env.QT_VERSION }}\${{ env.QT_ARCH }}

      - name: Build
        run: cmake --build build --config RelWithDebInfo

      - name: Stage artifact (flat layout)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deploy | Out-Null
          $dll = Get-ChildItem -Recurse build -Filter nsc_plugin.dll | Select-Object -First 1
          $json = Get-ChildItem -Recurse build -Filter nsc_plugin.json | Select-Object -First 1
          if (-not $dll) { throw "nsc_plugin.dll not found after build" }
          if (-not $json) { throw "nsc_plugin.json not found after build" }
          Copy-Item $dll.FullName  deploy/nsc_plugin.dll
          Copy-Item $json.FullName deploy/nsc_plugin.json
          Get-ChildItem deploy

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nsc_plugin
          path: |
            deploy/nsc_plugin.dll
            deploy/nsc_plugin.json
